<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PMAY AI Assistant</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f7fc;
}

header{
    background:#003366;
    color:white;
    padding:15px;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.logo-section{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-section img{
    width:60px;
    height:60px;
    border-radius:50%;
}

.portal-title h2{
    margin:0;
}

.home-btn{
    text-decoration:none;
    background:#ff9800;
    color:white;
    padding:10px 18px;
    border-radius:6px;
    font-weight:bold;
}

.ai-container{
    max-width:1100px;
    margin:20px auto;
    padding:20px;
}

.ai-header{
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,0.1);
}

.ai-header h1{
    color:#003366;
}

.ai-header p{
    color:#666;
    margin-top:10px;
}

.chat-box{
    margin-top:20px;
    background:white;
    border-radius:12px;
    height:550px;
    overflow-y:auto;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,0.1);
}

.user-msg{
    background:#d6ecff;
    padding:12px;
    border-radius:10px;
    margin:10px 0;
}

.bot-msg{
    background:#e8f5e9;
    padding:12px;
    border-radius:10px;
    margin:10px 0;
}

.input-area{
    margin-top:15px;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,0.1);
}

textarea{
    width:100%;
    height:120px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
    resize:none;
}

.btn-group{
    margin-top:10px;
}

button{
    border:none;
    padding:12px 25px;
    background:#0066cc;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#004f9e;
}

.quick-questions{
    margin-top:15px;
}

.quick-questions button{
    margin:5px;
    background:#198754;
}

footer{
    margin-top:20px;
    background:#003366;
    color:white;
    text-align:center;
    padding:15px;
}

.loading{
    color:#ff5722;
    font-weight:bold;
}

</style>
</head>

<body>

<header>

<div class="navbar">

<div class="logo-section">

<img src="Image/pmay-logo.jpg">

<div class="portal-title">
<h2>PMAY-U 2.0 Bihar</h2>
<p>AI Assistant</p>
</div>

</div>

<a href="index.html" class="home-btn">
<i class="fas fa-home"></i> Home
</a>

</div>

</header>

<div class="ai-container">

<div class="ai-header">

<h1>
🤖 PMAY AI Assistant
</h1>

<p>
Ask any question related to PMAY-U 2.0 in Hindi or English
</p>

</div>

<div id="chatBox" class="chat-box">

<div class="bot-msg">
👋 नमस्ते!

मैं PMAY AI Assistant हूँ।


</div>

</div>

<div class="quick-questions">

<button onclick="setQuestion('PMAY-U 2.0 eligibility kya hai?')">
Eligibility
</button>

<button onclick="setQuestion('Geo tagging kya hai?')">
Geo Tagging
</button>

<button onclick="setQuestion('Self survey kaise kare?')">
Self Survey
</button>

<button onclick="setQuestion('EWS income limit kya hai?')">
EWS
</button>

</div>

<div class="input-area">

<textarea
id="question"
placeholder="Type your PMAY question here...">
</textarea>

<div class="btn-group">

<button onclick="askAI()">
<i class="fas fa-paper-plane"></i>
Ask Assistant
</button>

</div>

</div>

</div>

<footer>
Government of Bihar |
PMAY-U 2.0 Bihar Portal |
AI Assistant
</footer>

<script>

function setQuestion(q){
    document.getElementById("question").value = q;
}

async function askAI(){

    let question = document.getElementById("question").value.trim();

    if(question === ""){
        alert("Please enter question");
        return;
    }

    let chat = document.getElementById("chatBox");

    chat.innerHTML += `
    <div class="user-msg">
        <b>You:</b><br>
        ${question}
    </div>
    `;

    chat.innerHTML += `
    <div id="loadingMsg" class="bot-msg">
        🤖 Thinking...
    </div>
    `;

    try {

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const text = await response.text();

        document.getElementById("loadingMsg").remove();

        chat.innerHTML += `
        <div class="bot-msg">
            ${text}
        </div>
        `;

        chat.scrollTop = chat.scrollHeight;

    } catch(error){

        if(document.getElementById("loadingMsg")){
            document.getElementById("loadingMsg").remove();
        }

        chat.innerHTML += `
        <div class="bot-msg">
            Error: ${error.message}
        </div>
        `;
    }

    document.getElementById("question").value = "";
}

</script>

</body>
</html>
